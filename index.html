<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153c33">
  <meta name="description" content="小学5年生理科を、知識・実験準備・考察の3段階で学ぶサイト">
  <title>理科ラボ 5｜条件をそろえて、たしかめよう</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">学習内容へ移動</a>
  <header class="site-header">
    <button id="home-button" class="brand" type="button" aria-label="単元選択へ戻る">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M17 7v13L8 36c-1.4 2.6.5 5 3.4 5h25.2c2.9 0 4.8-2.4 3.4-5L31 20V7"/><path d="M14 7h20M13 32h22"/><circle cx="20" cy="28" r="2"/><circle cx="29" cy="34" r="1.5"/></svg>
      </span>
      <span><strong>理科ラボ 5</strong><small>条件をそろえて、たしかめよう</small></span>
    </button>
    <div class="header-actions">
      <button id="discovery-button" class="icon-button" type="button" aria-label="発見図鑑を開く">🔍<span>発見図鑑</span></button>
      <button id="notebook-button" class="icon-button" type="button" aria-label="実験ノートを開く">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M8 3v18M11 8h6M11 12h6"/></svg>
        <span>実験ノート</span>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <dialog id="notebook-dialog" class="notebook-dialog">
    <div class="dialog-head">
      <div><span class="eyebrow">MY SCIENCE NOTE</span><h2>実験ノート</h2></div>
      <button class="dialog-close" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="notebook-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="catalog.js" defer></script>
  <script src="plants.js" defer></script>
  <script src="animals.js" defer></script>
  <script src="weather.js" defer></script>
  <script src="river.js" defer></script>
  <script src="solutions.js" defer></script>
  <script src="electromagnet.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="gamification.js" defer></script>
  <script src="extras.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
